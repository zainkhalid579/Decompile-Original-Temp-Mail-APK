name: Build Temp Mail with Floating OTP Assistant

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/trigger-floating-build'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android build tools
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)
          test -n "$SDKMANAGER" || { echo 'sdkmanager not found'; exit 1; }
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install \
            'platform-tools' \
            'platforms;android-36' \
            'build-tools;36.0.0'
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Download Apktool
        run: |
          set -euo pipefail
          mkdir -p work
          curl -fL --retry 3 https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar -o work/apktool.jar

      - name: Decode the unchanged original APK
        run: java -jar work/apktool.jar d -f com.tempmail-4.09.apk -o work/temp-mail-decoded

      - name: Compile the overlay helper
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_JAR="$ANDROID_HOME/platforms/android-36/android.jar"
          mkdir -p work/helper-classes work/helper-dex
          javac -source 8 -target 8 -classpath "$ANDROID_JAR" \
            -d work/helper-classes .github/patches/FloatingOtpAssistant.java
          jar --create --file work/helper.jar -C work/helper-classes .
          "$ANDROID_HOME/build-tools/36.0.0/d8" --min-api 26 --lib "$ANDROID_JAR" \
            --output work/helper-dex work/helper.jar

      - name: Patch and rebuild Temp Mail
        run: python3 .github/patches/patch_original_apk.py work/temp-mail-decoded work/helper-dex/classes.dex

      - name: Align and sign the test APK
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -v -keystore work/test-signing.jks -storepass android \
            -keypass android -alias tempmail-test -keyalg RSA -keysize 2048 -validity 10000 \
            -dname 'CN=Temp Mail Test Build, OU=Local, O=Temp Mail, L=Unknown, S=Unknown, C=US'
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -f -p 4 work/temp-mail-merged.apk work/temp-mail-aligned.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign --ks work/test-signing.jks \
            --ks-key-alias tempmail-test --ks-pass pass:android --key-pass pass:android \
            --out work/TempMail-4.09-Floating-OTP-test.apk work/temp-mail-aligned.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose work/TempMail-4.09-Floating-OTP-test.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TempMail-4.09-Floating-OTP-test-apk
          path: work/TempMail-4.09-Floating-OTP-test.apk
          if-no-files-found: error
          retention-days: 7

